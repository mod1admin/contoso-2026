name: Pack solution2610222
on:
  push:
    paths:
      - solutions/solution2610222/**
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/powerplatform-actions/actions-install@v1     
      - uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-file: out/exported/solution2610222.zip
          solution-folder: solutions/solution2610222
          solution-type: Unmanaged
      - uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-file: out/exported/solution2610222_managed.zip
          solution-folder: solutions/solution2610222
          solution-type: Managed         
      - uses: actions/upload-artifact@v4
        with:
          name: packed-solution
          path: out/
